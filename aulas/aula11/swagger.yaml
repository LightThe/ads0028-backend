openapi: 3.1.1
info:
  title: Minha API
  description: Uma api Express JS para experimentar a documentação do swagger (que certamente funciona)
  version: 0.1.1
servers:
  - url: http://localhost:3000
    description: Ambiente local
tags:
  - tarefas
paths:
  /tarefas:
    get:
      tags:
        - tarefas
      responses:
        200: 
          content:
            application/json:
              schema:
                type: array

    post:
      tags:
        - tarefas
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        201:
          content:
              application/json:
                schema:
                  type: object
        422:
          content:
            application/json:
              schema:
                type: object

  /tarefas/id:
    get:
      tags:
        - tarefas
      parameters:
        - in: path
          required: true
          name: tarefaId
          schema:
            type: string
      responses:
        200:
          content:
            application/json:
              schema:
                type: object
        404:
          content:
            application/json:
              schema:
                type: object
        500:
          content:
            application/json:
              schema:
                type: object
    put:
      tags:
        - tarefas

    delete:
      tags:
        - tarefas
